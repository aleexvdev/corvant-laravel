name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        db: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: corvant_testing
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: corvant
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      pgsql:
        image: postgres:16
        env:
          POSTGRES_DB: corvant_testing
          POSTGRES_USER: corvant
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, pgsql, bcmath, intl, zip, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Select DB env for this matrix leg
        run: |
          if [ "${{ matrix.db }}" = "mysql" ]; then
            DB_CONNECTION=mysql
            DB_PORT=3306
          else
            DB_CONNECTION=pgsql
            DB_PORT=5432
          fi
          {
            echo "DB_CONNECTION=$DB_CONNECTION"
            echo "DB_PORT=$DB_PORT"
            echo "DB_HOST=127.0.0.1"
            echo "DB_DATABASE=corvant_testing"
            echo "DB_USERNAME=corvant"
            echo "DB_PASSWORD=secret"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: vendor/bin/pest

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish
